<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Emblem: Modern R with Tech Angles -->
  <g transform="translate(10, 10)">
    <!-- Base Shape -->
    <path d="M 30 10 L 65 10 C 80 10, 90 20, 90 35 C 90 50, 80 60, 65 60 L 30 60 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Vertical Spine -->
    <line x1="30" y1="10" x2="30" y2="90" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Tech Diagonal Leg -->
    <path d="M 55 58 L 85 90" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Glowing Node Accent -->
    <circle cx="85" cy="90" r="5" fill="#06B6D4"/>
  </g>

  <!-- Typography -->
  <!-- RIMON -->
  <text x="125" y="72" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#0F172A" letter-spacing="1.5">RIMON</text>
  <!-- TECH -->
  <text x="295" y="72" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="300" font-size="44" fill="#06B6D4" letter-spacing="2">TECH</text>
  <!-- Tagline / Subtitle -->
  <text x="127" y="93" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="12" fill="#64748B" letter-spacing="4">INNOVATION &amp; DEVELOPMENT</text>
</svg>
